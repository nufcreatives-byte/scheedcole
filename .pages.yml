media:
  input: images
  output: images
content:
  - name: projects
    label: Work listings (draft)
    type: file
    path: cms-preparation/projects.json
    fields:
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - {name: id, label: Project ID, type: uuid, options: {editable: false, generate: false}}
          - {name: title, label: Title, type: string}
          - {name: metadata, label: Location and date, type: string}
          - {name: type, label: Type of work, type: string}
          - {name: description, label: Description, type: text}
          - {name: image, label: Cover photograph, type: image}
          - {name: image_alt, label: Image description, type: string}
          - {name: project_url, label: Existing project page (optional), type: string, required: false}
          - {name: press_url, label: Press page, type: string, required: false}
  - name: press
    label: Press listings (draft)
    type: file
    path: cms-preparation/press.json
    fields:
      - name: articles
        label: Articles
        type: object
        list: true
        fields:
          - {name: title, label: Title, type: string}
          - {name: source_date, label: Publication and date, type: string}
          - {name: date, label: Date for ordering, type: string, required: false}
          - {name: project, label: Related project, type: string, required: false}
          - {name: url, label: Article link, type: string}
  - name: home
    label: Home (draft)
    type: file
    path: cms-preparation/home.json
    fields:
      - {name: hero_name, label: Cover name, type: string}
      - {name: hero_role, label: Cover role, type: string}
      - {name: practice_statement, label: Practice statement, type: text}
      - {name: about_intro, label: About introduction, type: text}
      - {name: contact_intro, label: Contact introduction, type: text}
      - {name: email, label: Contact email, type: string}
