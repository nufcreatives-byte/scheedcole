# Draft only: authentication and publishing are not configured.
# These files do not yet feed the live site.
backend:
  name: github
  repo: nufcreatives-byte/scheedcole
  branch: cms-content-preparation
local_backend: true
media_folder: images
public_folder: images
collections:
  - name: projects
    label: Projects
    files:
      - name: project_list
        label: Project listing
        file: cms-preparation/projects.json
        fields:
          - name: projects
            label: Projects
            widget: list
            fields:
              - {name: title, label: Title, widget: string}
              - {name: metadata, label: Location and date, widget: string}
              - {name: type, label: Project type, widget: string}
              - {name: description, label: Description, widget: text}
              - {name: image, label: Image, widget: image}
              - {name: image_alt, label: Image description, widget: string}
              - {name: project_url, label: Existing project page, widget: string}
              - {name: press_url, label: Existing press page, widget: string, required: false}
  - name: press
    label: Press
    files:
      - name: press_list
        label: Press listing
        file: cms-preparation/press.json
        fields:
          - name: articles
            label: Articles
            widget: list
            fields:
              - {name: title, label: Title, widget: string}
              - {name: source_date, label: Publication and date, widget: string}
              - {name: date, label: Sort date, widget: string, required: false}
              - {name: project, label: Related project, widget: string, required: false}
              - {name: url, label: Article URL, widget: string}
