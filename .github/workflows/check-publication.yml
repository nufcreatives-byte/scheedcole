name: Check public site
on:
  push:
    branches: [check-pages-publication]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect published website
        run: |
          for path in index.html script.js about.html studio.html; do
            echo "Checking $path"
            curl -sS -L -w '\nHTTP %{http_code}\n' "https://nufcreatives-byte.github.io/scheedcole/$path?check=published20261027" -o "/tmp/$path"
            wc -c "/tmp/$path"
          done
          if grep -q "skilled professionals" /tmp/studio.html; then echo "STUDIO_LATEST=yes"; else echo "STUDIO_LATEST=no"; fi
          if grep -q "const primaryNav" /tmp/script.js; then echo "NAV_LATEST=yes"; else echo "NAV_LATEST=no"; fi
          if grep -q 'id="capabilities"' /tmp/about.html; then echo "ABOUT_LATEST=yes"; else echo "ABOUT_LATEST=no"; fi
